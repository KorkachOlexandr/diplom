[project]
name = "diplom"
version = "0.1.0"
description = "Anti-plagiarism screening tool for Google Classroom"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pydantic>=2.6",
    "requests>=2.31",
    "datasketch>=1.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Sentence-embedding paraphrase channel (Phase 2). Heavy: ~1.5GB with torch
# and a one-time model download. MinHash channel works without this.
embeddings = [
    "sentence-transformers>=2.5",
]
# CopyLeaks webhook receiver (Phase 4).
webhook = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
# Evaluation chapter.
eval = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
