[project]
name = "diplom"
version = "0.1.0"
description = "Anti-plagiarism screening tool for Google Classroom"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
# Phase 2 (cohort similarity)
cohort = [
    "datasketch>=1.6",
    "sentence-transformers>=2.5",
    "faiss-cpu>=1.7",
    "numpy>=1.26",
]
# Phase 5 (evaluation)
eval = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
