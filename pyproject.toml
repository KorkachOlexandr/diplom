[project]
name = "diplom"
version = "0.1.0"
description = "Code-plagiarism screening for Google Classroom programming assignments"
requires-python = ">=3.11"
# Cohort signal (winnowing + AST hashing) uses only the stdlib: Python's
# tokenize and ast modules. No NLP libraries needed for the core algorithm.
dependencies = [
    "streamlit>=1.32",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
# Optional Moss/JPlag client integration would live here in the future;
# for now the web-check signal is intentionally stubbed.
eval = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
